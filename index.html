<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="sahayak-standalone" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<meta name="description" content="Sahayak: offline scam check and benefits guide, running on this node.">
<title>Sahayak · सहायक</title>
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="icon" href="app/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
<link rel="preload" href="app/fonts/symbols.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="app/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" data-go="home" type="button" aria-label="Sahayak home">
      <span class="brand-mark" aria-hidden="true"><span class="ms">verified_user</span></span>
      <span class="brand-text"><b>सहायक</b><small>SAHAYAK</small></span>
    </button>
    <span class="node-pill" id="node-pill" title=""><span class="dot" aria-hidden="true"></span><span data-i18n="node_pill"></span></span>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="Read screens aloud">
      <span class="ms on" aria-hidden="true">volume_up</span><span class="ms off" aria-hidden="true">volume_off</span>
    </button>
    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Change language">EN</button>
  </div>
</header>

<main id="main">
  <!-- HOME -->
  <section class="screen" data-screen="home">
    <div class="hero">
      <span class="hero-mark ms" aria-hidden="true">verified_user</span>
      <div class="hero-glass">
        <h1 data-i18n="home_title"></h1>
        <p class="sub" data-i18n="home_sub"></p>
        <ul class="trust">
          <li><span class="ms" aria-hidden="true">wifi_off</span><span data-i18n="trust_offline"></span></li>
          <li><span class="ms" aria-hidden="true">person_off</span><span data-i18n="trust_private"></span></li>
          <li><span class="ms" aria-hidden="true">volume_up</span><span data-i18n="trust_voice"></span></li>
        </ul>
      </div>
    </div>
    <p class="note" id="phone-mode-note" data-i18n="phone_mode_note" hidden></p>
    <div class="tiles">
      <button class="tile tile-shield" data-go="check" type="button">
        <span class="tile-icon" aria-hidden="true"><span class="ms">shield</span></span>
        <span class="tile-text"><span class="tile-title" data-i18n="tile_check"></span><span class="tile-sub" data-i18n="tile_check_sub"></span></span>
        <span class="ms chev" aria-hidden="true">chevron_right</span>
      </button>
      <button class="tile tile-rupee" data-go="benefits" type="button">
        <span class="tile-icon" aria-hidden="true"><span class="ms">currency_rupee</span></span>
        <span class="tile-text"><span class="tile-title" data-i18n="tile_benefits"></span><span class="tile-sub" data-i18n="tile_benefits_sub"></span></span>
        <span class="ms chev" aria-hidden="true">chevron_right</span>
      </button>
      <a class="tile tile-help" href="tel:1930">
        <span class="tile-icon" aria-hidden="true"><span class="ms">call</span></span>
        <span class="tile-text"><span class="tile-title" data-i18n="tile_help"></span><span class="tile-sub" data-i18n="tile_help_sub"></span></span>
        <span class="ms chev" aria-hidden="true">chevron_right</span>
      </a>
      <button class="tile tile-install" id="btn-install" type="button" hidden>
        <span class="tile-icon" aria-hidden="true"><span class="ms">install_mobile</span></span>
        <span class="tile-text"><span class="tile-title" data-i18n="install_title"></span><span class="tile-sub" data-i18n="install_sub"></span></span>
        <span class="ms chev" aria-hidden="true">chevron_right</span>
      </button>
    </div>
    <details class="voice-settings settings">
      <summary><span class="ms" aria-hidden="true">record_voice_over</span><span data-i18n="voice_settings"></span></summary>
      <div class="settings-body">
        <p class="settings-label" data-i18n="text_size"></p>
        <div class="seg" role="radiogroup" aria-label="Text size">
          <label><input type="radio" name="tsize" value="normal" checked><span data-i18n="size_normal"></span></label>
          <label><input type="radio" name="tsize" value="large"><span data-i18n="size_large"></span></label>
          <label><input type="radio" name="tsize" value="xl"><span data-i18n="size_xl"></span></label>
        </div>
        <p class="settings-label" data-i18n="voice_label"></p>
        <div class="seg" role="radiogroup" aria-label="Voice">
          <label><input type="radio" name="vgender" value="female" checked><span data-i18n="voice_female"></span></label>
          <label><input type="radio" name="vgender" value="male"><span data-i18n="voice_male"></span></label>
        </div>
        <p class="settings-label" data-i18n="speed_label"></p>
        <div class="seg" role="radiogroup" aria-label="Speed">
          <label><input type="radio" name="vspeed" value="normal" checked><span data-i18n="speed_normal"></span></label>
          <label><input type="radio" name="vspeed" value="slow"><span data-i18n="speed_slow"></span></label>
        </div>
        <p class="note" id="voice-status"></p>
      </div>
    </details>
  </section>

  <!-- CHECK A MESSAGE -->
  <section class="screen" data-screen="check" hidden>
    <div class="screen-head">
      <button class="back" data-go="home" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <h2 data-i18n="check_title"></h2>
    </div>
    <div class="modes" role="radiogroup" aria-label="What to check">
      <label><input type="radio" name="mode" value="text" checked><span class="seg-item"><span class="ms" aria-hidden="true">sms</span><span data-i18n="mode_text"></span></span></label>
      <label><input type="radio" name="mode" value="call"><span class="seg-item"><span class="ms" aria-hidden="true">phone_in_talk</span><span data-i18n="mode_call"></span></span></label>
      <label><input type="radio" name="mode" value="qr"><span class="seg-item"><span class="ms" aria-hidden="true">qr_code_scanner</span><span data-i18n="mode_qr"></span></span></label>
      <label><input type="radio" name="mode" value="ocr"><span class="seg-item"><span class="ms" aria-hidden="true">screenshot_monitor</span><span data-i18n="mode_ocr"></span></span></label>
    </div>
    <div id="mode-text">
      <button id="btn-paste" class="tinted big paste-btn" type="button" hidden><span class="ms" aria-hidden="true">content_paste</span><span data-i18n="paste_check"></span></button>
      <label class="label" for="msg" id="msg-label" data-i18n="check_label"></label>
      <p class="note" id="ocr-review" data-i18n="ocr_review" hidden></p>
      <textarea id="msg" maxlength="4000" autocomplete="off" spellcheck="false"></textarea>
      <div id="mic-msg" class="mic-slot"></div>
      <details class="extra">
        <summary data-i18n="sender_add"></summary>
        <label class="label" for="sender" data-i18n="sender_label"></label>
        <input id="sender" type="text" maxlength="40" autocomplete="off" inputmode="text" placeholder="AX-SBIBNK-S / 98xxxxxx10">
      </details>
      <button id="btn-check" class="primary big" type="button"><span class="ms" aria-hidden="true">shield</span><span class="btn-label" data-i18n="check_btn"></span></button>
      <p class="try" data-i18n="try_examples"></p>
      <div class="chips" id="examples"></div>
    </div>
    <div id="mode-image" hidden>
      <p class="label" id="image-label"></p>
      <label class="photo-btn">
        <input id="image-input" type="file" accept="image/*" hidden>
        <span class="photo-glyph" aria-hidden="true"><span class="ms">photo_camera</span></span>
        <span id="image-btn-label"></span>
      </label>
      <p class="try" id="qr-try-label" data-i18n="qr_try"></p>
      <div class="chips" id="qr-examples"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" data-screen="result" hidden>
    <div class="screen-head">
      <button class="back" data-go="check" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
    </div>
    <div id="verdict" class="verdict" role="status" aria-live="polite"></div>
    <h2 id="headline" tabindex="-1"></h2>
    <div id="qr-box" class="qr-box" hidden></div>
    <details id="checked" class="checked" hidden><summary data-i18n="checked_msg"></summary><p id="checked-text"></p></details>
    <div id="explain" class="explain loading">
      <span class="explain-title" data-i18n="in_simple_words"></span>
      <p id="explain-text"></p>
    </div>
    <h3 data-i18n="what_to_do"></h3>
    <ol id="actions" class="actions"></ol>
    <div class="cta-row result-actions">
      <a id="btn-1930" class="danger wide" href="tel:1930"><span class="ms" aria-hidden="true">call</span><span data-i18n="call_1930"></span></a>
      <button id="btn-speak" class="tinted" type="button"><span class="ms" aria-hidden="true">volume_up</span><span data-i18n="speak_btn"></span></button>
      <button id="btn-share" class="tinted" type="button" hidden><span class="ms" aria-hidden="true">share</span><span data-i18n="share_btn"></span></button>
    </div>
    <h3 data-i18n="why"></h3>
    <ul id="reasons" class="reasons"></ul>
    <div class="cta-row">
      <button id="btn-complaint" class="secondary" type="button"><span class="ms" aria-hidden="true">description</span><span data-i18n="complaint_btn"></span></button>
      <button id="btn-real-benefits" class="tinted wide" data-go="benefits" type="button" hidden><span class="ms" aria-hidden="true">account_balance</span><span data-i18n="real_benefits"></span></button>
      <button id="btn-agent-check" class="secondary wide" type="button"><span class="ms" aria-hidden="true">support_agent</span><span data-i18n="ask_agent"></span></button>
      <button id="btn-check-another" class="secondary wide" data-go="check" type="button"><span class="ms" aria-hidden="true">refresh</span><span data-i18n="check_another"></span></button>
    </div>
    <button id="safety-badge" class="safety" type="button" aria-expanded="false" aria-controls="safety-detail" hidden></button>
    <div id="safety-detail" class="safety-detail" hidden></div>
    <p id="meta" class="meta"></p>
  </section>

  <!-- 1930 COMPLAINT DRAFT -->
  <section class="screen" data-screen="complaint" hidden>
    <div class="screen-head">
      <button class="back no-print" data-go="result" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <h2 data-i18n="complaint_title"></h2>
    </div>
    <p class="note" data-i18n="complaint_note"></p>
    <form id="complaint-form" class="form-grid" autocomplete="off">
      <label><span data-i18n="c_when"></span><input type="datetime-local" name="when"></label>
      <label><span data-i18n="c_channel"></span><input type="text" name="channel"></label>
      <label><span data-i18n="c_number"></span><input type="tel" name="number"></label>
      <label><span data-i18n="c_upi"></span><input type="text" name="upi"></label>
      <label><span data-i18n="c_link"></span><input type="text" name="link"></label>
      <label><span data-i18n="c_lost"></span><input type="number" name="lost" min="0" inputmode="numeric"></label>
      <label><span data-i18n="c_txn"></span><input type="text" name="txn"></label>
      <label><span data-i18n="c_message"></span><textarea name="message" rows="5" readonly></textarea></label>
    </form>
    <div class="cta-row no-print">
      <button id="btn-print" class="primary" type="button"><span class="ms" aria-hidden="true">print</span><span data-i18n="print_btn"></span></button>
      <button class="secondary" data-go="result" type="button"><span class="ms" aria-hidden="true">arrow_back</span><span data-i18n="back"></span></button>
    </div>
  </section>

  <!-- BENEFITS NAVIGATOR: intro -->
  <section class="screen" data-screen="benefits" hidden>
    <div class="screen-head">
      <button class="back" data-go="home" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
    </div>
    <span class="feature-icon" aria-hidden="true"><span class="ms">currency_rupee</span></span>
    <h2 data-i18n="tile_benefits"></h2>
    <p class="sub" data-i18n="nav_intro"></p>
    <ul class="promise">
      <li data-i18n="nav_promise_1"></li>
      <li data-i18n="nav_promise_2"></li>
      <li data-i18n="nav_promise_3"></li>
    </ul>
    <button id="btn-nav-start" class="primary big" type="button"><span data-i18n="nav_start"></span><span class="ms" aria-hidden="true">arrow_forward</span></button>
    <p class="try" data-i18n="nav_try"></p>
    <div class="chips" id="nav-demos"></div>
    <p class="covers" id="nav-covers"></p>
  </section>

  <!-- BENEFITS NAVIGATOR: one question per screen -->
  <section class="screen" data-screen="question" hidden>
    <div class="q-head">
      <button id="btn-q-back" class="back" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <div class="q-progress">
        <span id="q-count"></span>
        <span class="bar" aria-hidden="true"><span id="q-bar"></span></span>
      </div>
    </div>
    <h2 id="q-text" tabindex="-1"></h2>
    <p id="q-help" class="sub"></p>
    <div id="q-body" class="q-body"></div>
    <div id="q-mic" class="mic-slot"></div>
    <div id="q-confirm" class="confirm" role="alertdialog" aria-live="assertive" hidden></div>
    <div class="q-foot">
      <button id="btn-q-listen" class="tinted" type="button"><span class="ms" aria-hidden="true">volume_up</span><span data-i18n="speak_btn"></span></button>
    </div>
  </section>

  <!-- BENEFITS NAVIGATOR: result -->
  <section class="screen" data-screen="benefits-result" hidden>
    <div class="screen-head">
      <button class="back" data-go="benefits" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
    </div>
    <div id="nav-summary" class="nav-summary" role="status" aria-live="polite" tabindex="-1"></div>
    <div id="nav-health"></div>
    <div id="nav-groups"></div>
    <div id="nav-docs"></div>
    <p class="note" id="nav-amount-note"></p>
    <p class="note warn" id="nav-fraud-note"></p>
    <div class="cta-row">
      <button id="btn-slip" class="primary wide" type="button"><span class="ms" aria-hidden="true">receipt_long</span><span data-i18n="nav_slip"></span></button>
      <button id="btn-nav-listen" class="tinted" type="button"><span class="ms" aria-hidden="true">volume_up</span><span data-i18n="speak_btn"></span></button>
      <button id="btn-nav-change" class="secondary" type="button"><span class="ms" aria-hidden="true">undo</span><span data-i18n="nav_change"></span></button>
      <button id="btn-agent-nav" class="secondary wide" type="button"><span class="ms" aria-hidden="true">support_agent</span><span data-i18n="ask_agent"></span></button>
      <button id="btn-nav-restart" class="ghost wide" type="button"><span class="ms" aria-hidden="true">restart_alt</span><span data-i18n="nav_restart"></span></button>
    </div>
    <p id="nav-meta" class="meta"></p>
  </section>

  <!-- BENEFITS NAVIGATOR: printable case slip -->
  <section class="screen" data-screen="slip" hidden>
    <div class="screen-head no-print">
      <button class="back" data-go="benefits-result" type="button" data-i18n-label="back"><span class="ms" aria-hidden="true">arrow_back</span></button>
    </div>
    <div id="slip-sheet" class="slip-sheet"></div>
    <div class="cta-row no-print">
      <button id="btn-slip-print" class="primary" type="button"><span class="ms" aria-hidden="true">print</span><span data-i18n="print_btn"></span></button>
      <button class="secondary" data-go="benefits-result" type="button"><span class="ms" aria-hidden="true">arrow_back</span><span data-i18n="back"></span></button>
    </div>
  </section>
</main>

<div id="ticket" class="ticket-sheet" role="alertdialog" aria-live="assertive" hidden>
  <p class="ticket-label"><span class="ms" aria-hidden="true">confirmation_number</span><span data-i18n="ticket_title"></span></p>
  <div id="ticket-no" class="ticket-no"></div>
  <p class="sub" data-i18n="ticket_sub"></p>
  <button class="primary" id="ticket-ok" type="button" data-i18n="ticket_ok"></button>
</div>

<footer class="foot"><span data-i18n="foot"></span> <span id="pack-version"></span></footer>
<script src="app/mic.js" defer></script>
<script src="app/checker.js" defer></script>
<script src="app/navigator.js" defer></script>
<script src="app/app.js" defer></script>
</body>
</html>
